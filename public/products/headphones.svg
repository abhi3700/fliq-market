    <path d="M370 346c0-132 103-224 230-224s230 92 230 224" fill="none" stroke="#475569" stroke-width="18" stroke-linecap="round" opacity=".8"/>
    <rect x="235" y="344" width="220" height="310" rx="96" fill="url(#headset)" transform="rotate(-7 345 499)"/>
    <rect x="745" y="344" width="220" height="310" rx="96" fill="url(#headset)" transform="rotate(7 855 499)"/>
    <rect x="281" y="386" width="123" height="226" rx="58" fill="#64748b" opacity=".55" transform="rotate(-7 342 499)"/>
    <rect x="796" y="386" width="123" height="226" rx="58" fill="#64748b" opacity=".55" transform="rotate(7 858 499)"/>
    <circle cx="345" cy="501" r="34" fill="#38bdf8" opacity=".65"/>
    <circle cx="855" cy="501" r="34" fill="#38bdf8" opacity=".65"/>
  </g>
</svg>
