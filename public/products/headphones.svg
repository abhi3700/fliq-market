<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Noise-canceling headphones</title>
  <desc id="description">Dark over-ear headphones on a soft blue background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cffafe"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="headset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#0f172a" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#background)"/>
  <ellipse cx="600" cy="688" rx="330" ry="52" fill="#0f172a" opacity=".12"/>
